name: Scrape internships

on:
  # Schedule paused 2026-11-22: Workday refuses GitHub's servers (every Workday
  # company returns 429 here, but works from a home connection). The scheduled
  # run is moving to a home server. Re-enable with:
  #   schedule:
  #     - cron: "0 13,21 * * *"
  workflow_dispatch:          # manual runs from the Actions tab still work

permissions:
  contents: write             # allow the job to commit the updated database back

concurrency:
  group: scrape               # never run two scrapes at once (they would double-email and collide on the database)
  cancel-in-progress: false   # a second run waits for the first instead of killing it

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Persist the database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/postings.db
          git commit -m "Update postings database [skip ci]" || echo "No changes to commit"
          git pull --rebase    # pick up anything pushed while the scrape was running
          git push