name: Scrape internships

on:
  schedule:
    - cron: "0 13 * * *"     # daily at 13:00 UTC (~9am Ottawa time)
  workflow_dispatch:          # also lets you run it manually from the Actions tab

permissions:
  contents: write             # allow the job to commit the updated database back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Persist the database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/postings.db
          git commit -m "Update postings database [skip ci]" || echo "No changes to commit"
          git push